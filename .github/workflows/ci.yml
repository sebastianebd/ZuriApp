name: CI

on:
  push:
    branches: [main, stage]
  pull_request:
    branches: [main, stage]

jobs:
  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
      - name: Install Server Dependencies
        run: |
          cd server
          npm ci
      - name: Run Server Tests
        run: |
          cd server
          npm test
        env:
          CI: true

  test-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
      - name: Install Client Dependencies
        run: |
          cd client
          npm ci --legacy-peer-deps
      - name: Run Client Tests
        run: |
          cd client
          npm test
        env:
          CI: true
