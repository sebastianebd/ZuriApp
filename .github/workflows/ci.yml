name: CI

on:
  push:
    branches: [main, stage]
  pull_request:
    branches: [main, stage]

jobs:
  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
      - name: Install Server Dependencies
        run: |
          cd server
          npm ci
      - name: Run Server Tests
        run: |
          cd server
          npm test
        env:
          CI: true

  test-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
      - name: Install Client Dependencies
        run: |
          cd client
          npm ci --legacy-peer-deps
      - name: Run Client Tests
        run: |
          cd client
          npm test
        env:
          CI: true

  e2e-tests:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci --legacy-peer-deps

      - name: Install Playwright Browsers
        run: |
          cd client
          npx playwright install --with-deps chromium

      - name: Start Backend Server
        run: |
          cd server
          npm run dev &
        env:
          NODE_ENV: development
          PORT: 3500
          DATABASE_URI: mongodb://localhost:27017/zuriapp_test
          ACCESS_TOKEN_SECRET: test-access-secret-key-for-ci
          REFRESH_TOKEN_SECRET: test-refresh-secret-key-for-ci
          CLIENT_URL: http://localhost:5173

      - name: Start Frontend Server
        run: |
          cd client
          npm run dev -- --host &
        env:
          VITE_PROXY_TARGET: http://localhost:3500

      - name: Wait for Services
        run: |
          npx wait-on http://localhost:3500/api/auth/health http://localhost:5173 --timeout 60000 || (echo "Services failed to start" && exit 1)

      - name: Run E2E Tests
        run: |
          cd client
          npx playwright test
        env:
          CI: true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 30
