name: CI

on:
  push:
    branches: [main, stage]
  pull_request:
    branches: [main, stage]

jobs:
  test-server:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - name: Install Server Dependencies
        run: |
          cd server
          npm ci
      - name: Run Server Tests
        run: |
          cd server
          npm test
        env:
          CI: true

  test-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - name: Install Client Dependencies
        run: |
          cd client
          npm ci --legacy-peer-deps
      - name: Run Client Tests
        run: |
          cd client
          npm test
        env:
          CI: true

  e2e-tests:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci --legacy-peer-deps

      - name: Install Playwright Browsers
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          cd client
          sudo apt-get update
          npx playwright install --with-deps chromium

      - name: Start Backend Server
        run: |
          cd server
          npm run dev &
        env:
          NODE_ENV: development
          PORT: 3500
          DATABASE_URI: mongodb://localhost:27017/zuriapp_test
          ACCESS_TOKEN_SECRET: test-access-secret-key-for-ci
          REFRESH_TOKEN_SECRET: test-refresh-secret-key-for-ci
          CLIENT_URL: http://localhost:5173
          DISABLE_CONCURRENT_SESSION: "true"

      - name: Start Frontend Server
        run: |
          cd client
          npm run dev -- --host &
        env:
          VITE_PROXY_TARGET: http://localhost:3500

      - name: Wait for Services
        run: |
          npx wait-on http://localhost:3500/api/auth/health http://localhost:5173 --timeout 60000 || (echo "Services failed to start" && exit 1)

      - name: Seed Test Database
        run: |
          cd server
          npm run seed
        env:
          DATABASE_URI: mongodb://localhost:27017/zuriapp_test


      - name: Seed Cargos (Permissions)
        run: |
          cd server
          npm run seed:cargos
        env:
          DATABASE_URI: mongodb://localhost:27017/zuriapp_test

      - name: Seed Services
        run: |
          cd server
          npm run seed:services
        env:
          DATABASE_URI: mongodb://localhost:27017/zuriapp_test

      - name: Seed Turn Types
        run: |
          cd server
          npm run seed:turntypes
        env:
          DATABASE_URI: mongodb://localhost:27017/zuriapp_test

      - name: Run E2E Tests
        run: |
          cd client
          npx playwright test --reporter=list
        env:
          CI: true
          DEBUG: pw:api

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 30

      - name: Upload Test Results (Screenshots & Traces)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: client/test-results/
          retention-days: 7
