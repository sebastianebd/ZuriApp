services:
  mongo:
    image: mongo:latest
    container_name: zuri_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]

  mongo-init-replica:
    image: mongo:latest
    container_name: zuri_mongo_init
    depends_on:
      - mongo
    networks:
      - app-network
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mongosh --host mongo:27017 --eval 'try { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongo:27017\"}]}) } catch(e) { print(e) }';
      exit 0;
      "

  redis:
    image: redis:alpine
    container_name: zuri_redis
    ports:
      - "6379:6379"
    networks:
      - app-network

  minio:
    image: minio/minio
    container_name: zuri_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${AWS_ACCESS_KEY_ID:-tu_access_key}
      - MINIO_ROOT_PASSWORD=${AWS_SECRET_ACCESS_KEY:-tu_secret_key}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - app-network

  minio-init:
    image: minio/mc
    container_name: zuri_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 $${AWS_ACCESS_KEY_ID:-tu_access_key} $${AWS_SECRET_ACCESS_KEY:-tu_secret_key};
      /usr/bin/mc mb myminio/$${AWS_S3_BUCKET_NAME:-zuriapp-reportes-cartolas-prod} || true;
      /usr/bin/mc anonymous set public myminio/$${AWS_S3_BUCKET_NAME:-zuriapp-reportes-cartolas-prod};
      exit 0;
      "
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-tu_access_key}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-tu_secret_key}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-zuriapp-reportes-cartolas-prod}
    networks:
      - app-network

  server:
    image: node:22-alpine
    container_name: zuri_server
    working_dir: /app
    volumes:
      - ./server:/app
      - /app/node_modules
    ports:
      - "3500:3500"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3500
      - DATABASE_URI=${DATABASE_URI}
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - CLIENT_URL=${CLIENT_URL}
      - SENTRY_DSN=${SENTRY_DSN}
      - REDIS_URL=redis://redis:6379
      - RESEND_API_KEY=${RESEND_API_KEY}
      - WHATSAPP_VERSION=${WHATSAPP_VERSION}
      - WHATSAPP_PHONE_ID=${WHATSAPP_PHONE_ID}
      - WHATSAPP_TOKEN=${WHATSAPP_TOKEN}
      - API_URL=${API_URL}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
      - AWS_ENDPOINT=${AWS_ENDPOINT}
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
    command: sh -c "apk add --no-cache chromium nss freetype harfbuzz ca-certificates ttf-freefont && npm install && npm run dev"
    depends_on:
      - mongo
      - redis
    networks:
      - app-network

  client:
    image: node:22-alpine
    container_name: zuri_client
    working_dir: /app
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_PROXY_TARGET=http://server:3500
      - VITE_SENTRY_DSN=${VITE_SENTRY_DSN}
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host"
    depends_on:
      - server
    networks:
      - app-network

volumes:
  mongo-data:
  minio-data:

networks:
  app-network:
    driver: bridge
