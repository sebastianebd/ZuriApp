services:
  mongo:
    image: mongo:latest
    container_name: zuri_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  redis:
    image: redis:alpine
    container_name: zuri_redis
    ports:
      - "6379:6379"
    networks:
      - app-network

  server:
    image: node:22-alpine
    container_name: zuri_server
    working_dir: /app
    volumes:
      - ./server:/app
      - /app/node_modules
    ports:
      - "3500:3500"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3500
      - DATABASE_URI=${DATABASE_URI}
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - CLIENT_URL=${CLIENT_URL}
      - SENTRY_DSN=${SENTRY_DSN}
      - REDIS_URL=redis://redis:6379
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - RESEND_API_KEY=${RESEND_API_KEY}
    command: sh -c "npm install && npm run dev"
    depends_on:
      - mongo
      - redis
    networks:
      - app-network

  client:
    image: node:22-alpine
    container_name: zuri_client
    working_dir: /app
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_PROXY_TARGET=http://server:3500
      - VITE_SENTRY_DSN=${VITE_SENTRY_DSN}
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host"
    depends_on:
      - server
    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge
