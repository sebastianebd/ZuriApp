services:
  mongo:
    image: mongo:latest
    container_name: zuri_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  server:
    image: node:18-alpine
    container_name: zuri_server
    working_dir: /app
    volumes:
      - ./server:/app
      - /app/node_modules
    ports:
      - "3500:3500"
    environment:
      - NODE_ENV=development
      - PORT=3500
      - DATABASE_URI=mongodb://mongo:27017/zuri_db
      - ACCESS_TOKEN_SECRET=dev_secret_access
      - REFRESH_TOKEN_SECRET=dev_secret_refresh
    command: sh -c "npm install && npm run dev"
    depends_on:
      - mongo
    networks:
      - app-network

  client:
    image: node:18-alpine
    container_name: zuri_client
    working_dir: /app
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_PROXY_TARGET=http://server:3500
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host"
    depends_on:
      - server
    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge
